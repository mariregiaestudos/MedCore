      - name: Instalar ferramenta EF Core
        run: dotnet tool install dotnet-ef --version '10.*'

      - name: Configurar chave JWT para geração do bundle
        env:
          Jwt__Key: ${{ secrets.MEDCORE_JWT_KEY }}
        run: echo "Chave JWT disponibilizada para o processo."

      - name: Gerar bundle das migrations
        run: >
          dotnet ef migrations bundle
          --project MedCore.Infraestrutura/MedCore.Infraestrutura.csproj
          --startup-project MedCore.Api/MedCore.Api.csproj
          --configuration Release
          --output ./efbundle
          --self-contained
          --target-runtime linux-x64