
name: MedCore API - CI e CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Compilar, testar e gerar artefatos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restaurar dependências
        run: dotnet restore MedCore.Api.slnx

      - name: Compilar solução
        run: dotnet build MedCore.Api.slnx --configuration Release --no-restore

      - name: Executar testes
        run: dotnet test MedCore.Test/MedCore.Test.csproj --configuration Release --no-build --verbosity normal

      - name: Publicar API
        run: dotnet publish MedCore.Api/MedCore.Api.csproj --configuration Release --no-build --output ./publish

      - name: Instalar ferramenta EF Core
        run: dotnet tool install dotnet-ef --version '10.*'

      - name: Gerar bundle das migrations
        run: >
          dotnet ef migrations bundle
          --project MedCore.Infraestrutura/MedCore.Infraestrutura.csproj
          --startup-project MedCore.Api/MedCore.Api.csproj
          --configuration Release
          --output ./efbundle
          --self-contained
          --target-runtime linux-x64

      - name: Armazenar API publicada
        uses: actions/upload-artifact@v4
        with:
          name: medcore-api
          path: ./publish/
          if-no-files-found: error
          retention-days: 1

      - name: Armazenar bundle das migrations
        uses: actions/upload-artifact@v4
        with:
          name: medcore-migrations
          path: ./efbundle
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Atualizar banco e publicar no Azure
    runs-on: ubuntu-latest
    needs: build-and-test

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Baixar API publicada
        uses: actions/download-artifact@v4
        with:
          name: medcore-api
          path: ./publish

      - name: Baixar bundle das migrations
        uses: actions/download-artifact@v4
        with:
          name: medcore-migrations
          path: ./migrations

      - name: Tornar bundle executável
        run: chmod +x ./migrations/efbundle

      - name: Aplicar migrations no Azure SQL
        env:
          MEDCORE_CONNECTION_STRING: ${{ secrets.MEDCORE_SQL_CONNECTION_STRING }}
        run: ./migrations/efbundle --connection "$MEDCORE_CONNECTION_STRING"

      - name: Login no Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4C6E10E931EE40C2B4F32C083A95528B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0C01460D61044EBDADE13444DFCFC207 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D20DA90D755E4492983151F07F6DC0E3 }}

      - name: Publicar no Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: medcore-api-dev2026
          slot-name: Production
          package: ./publish
